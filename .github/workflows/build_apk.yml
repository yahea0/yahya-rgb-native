name: Build Yahya RGB Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Android Native Wrapper
        run: |
          echo "Generating native android scaffolds..."
          flutter create --org com.yahya.rgb --project-name yahya_rgb temp_scaffold
          if [ ! -d "android" ]; then
            cp -r temp_scaffold/android .
          fi
          rm -rf temp_scaffold

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Compile Native Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-RGB-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Yahya RGB Native App v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 تطبيق يحيى RGB للأندرويد جاهز للتحميل
            - تم البناء بنجاح بنسخة Release أصلية.
            - يدعم شاشات Super AMOLED بتردد 120Hz.
            - اضغط على ملف **app-release.apk** أدناه لتثبيته مباشرة على هاتفك.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
